<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Pin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/staff.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* (Giữ nguyên style) */
        .manage-layout { display: grid; grid-template-columns: 1fr; gap: 2.5rem; }
        @media (min-width: 1024px) { .manage-layout { grid-template-columns: 350px 1fr; } }
        .form-control-select { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; font-family: var(--font-family); border: 1px solid var(--border-color); border-radius: 12px; background: rgba(15, 20, 30, 0.72) url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22%23a0aec0%22%3E%3Cpath%20fill-rule%3D%22evenodd%22%20d%3D%22M5.293%207.293a1%201%200%20011.414%200L10%2010.586l3.293-3.293a1%201%200%20111.414%201.414l-4%204a1%201%200%2001-1.414%200l-4-4a1%201%200%20010-1.414z%22%20clip-rule%3D%22evenodd%22%20%2F%3E%3C%2Fsvg%3E') no-repeat right 0.75rem center; background-size: 1.25em 1.25em; color: var(--text-dark); -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        .table-scroll-container { max-height: 600px; overflow-y: auto; overflow-x: auto; }
        .btn.warning { background-color: #ffc107; color: #212529; }
        .btn.warning:hover { background-color: #e0a800; }
        .btn.danger { background-color: #f87171; color: #020817; }
        .btn.danger:hover { background-color: #ef4444; }
    </style>
</head>

<body class="staff-body">

<header class="staff-top-nav">
    <div class="container nav-inner">
        <a th:href="@{/staff/dashboard}" class="brand">
            <i class="fas fa-charging-station brand-icon"></i>
            <span th:text="${stationName ?: 'Staff'}">Tên Trạm</span>
        </a>
        <nav class="nav-links">
            <a th:href="@{/staff/dashboard}" class="nav-link-button"> <i class="fas fa-tachometer-alt"></i> Tổng quan
            </a>
            <a th:href="@{/staff/charge-station}" class="nav-link-button"> <i class="fas fa-bolt"></i> Trạm Sạc
            </a>
            <a th:href="@{/staff/batteries}" class="nav-link-button active"> <i class="fas fa-list"></i> Quản lý (Tất cả)
            </a>
            <a href="#" class="nav-link-button">Giao dịch</a>
        </nav>
        <div class="auth-area">
            <span class="welcome" th:if="${session.loggedInStaff}">
                Chào, <strong th:text="${session.loggedInStaff.fullName}"></strong>
            </span>
            <form th:action="@{/logout}" method="POST" style="margin: 0;">
                <button class="btn ghost" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</header>
<main class="container">
    <header class="staff-header" style="margin-bottom: 2rem;">
        <h1 class="staff-title">Quản lý Pin</h1>
        <p class="staff-subtitle">Thêm mới pin hoặc cập nhật trạng thái pin tại trạm.</p>
    </header>
    <div th:if="${successMessage}" class="staff-alert success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="staff-alert error" th:text="${errorMessage}"></div>
    <div th:if="${createError}" class="staff-alert error" th:text="${createError}"></div>
    <div class="manage-layout">
        <div class="staff-form-card" style="padding: 2rem; max-width: none;">
            <h2>Thêm pin mới</h2>
            <form th:action="@{/staff/batteries/add}" method="POST" th:object="${newBattery}">
                <div class="form-group"><label for="model">Model Pin</label><input type="text" id="model" th:field="*{model}" placeholder="Ví dụ: Model-X, Vin-A1"><small class="form-error" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></small></div>
                <div class="form-group"><label for="state">Trạng thái ban đầu</label><select id="state" th:field="*{state}" class="form-control-select"><option value="charging">Charging (Đang sạc)</option><option value="maintenance">Maintenance (Bảo trì)</option><option value="full">Full (Đầy)</option></select><small class="form-error" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></small></div>
                <div class="form-group"><label for="sohPercent">SOH (%)</label><input type="number" id="sohPercent" th:field="*{sohPercent}" placeholder="100"><small class="form-error" th:if="${#fields.hasErrors('sohPercent')}" th:errors="*{sohPercent}"></small></div>
                <div class="form-group"><label for="socPercent">SOC (%)</label><input type="number" id="socPercent" th:field="*{socPercent}" placeholder="0"><small class="form-error" th:if="${#fields.hasErrors('socPercent')}" th:errors="*{socPercent}"></small></div>
                <div class="form-group"><label for="quantity">Số lượng</label><input type="number" id="quantity" th:field="*{quantity}" placeholder="1"><small class="form-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></small></div>
                <div class="form-actions" style="text-align: left; margin-top: 1rem;"><button type="submit" class="btn primary" style="width: 100%;">Thêm Pin</button></div>
            </form>
        </div>
        <div class="staff-content-card" style="padding: 2rem;">
            <div class="content-header" style="margin-bottom: 1rem;">
                <h2 style="font-size: 1.5rem;">Danh sách pin tại trạm</h2>
                <form th:action="@{/staff/batteries}" method="GET" class="staff-search" style="align-items: center;">
                    <select name="searchType" class="form-control-select" style="padding: 0.6rem 1rem; width: 150px; font-size: 0.9rem;"><option value="state" th:selected="${currentSearchType == 'state' or currentSearchType == null}">Theo Trạng thái</option><option value="id" th:selected="${currentSearchType == 'id'}">Theo ID Pin</option><option value="model" th:selected="${currentSearchType == 'model'}">Theo Model</option></select>
                    <input type="text" name="searchTerm" placeholder="Nhập từ khóa..." th:value="${currentSearchTerm}" style="width: 200px;">
                    <button type="submit" class="btn primary" style="padding: 0.6rem 1.2rem;">Tìm</button>
                </form>
            </div>
            <div class="table-scroll-container">
                <table class="staff-table">
                    <thead><tr><th>ID</th><th>Model</th><th>SOH</th><th>SOC</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
                    <tbody>
                    <tr th:each="battery : ${batteryList}">
                        <td th:text="${battery.batteryId}"></td><td th:text="${battery.model}"></td><td th:text="${battery.sohPercent + '%'}"></td><td th:text="${battery.socPercent + '%'}"></td>
                        <td><span class="status-badge" th:classappend="${battery.state == 'full' or battery.state == 'charging'} ? 'active' : 'inactive'" th:text="${battery.state}"></span></td>
                        <td style="min-width: 250px;">
                            <div th:if="${battery.state == 'maintenance'}"><form th:action="@{/staff/batteries/update}" method="POST" style="display: inline-block;"><input type="hidden" name="batteryId" th:value="${battery.batteryId}"><input type="hidden" name="newState" value="retired"><button type="submit" class="btn danger" style="padding: 0.5rem 1rem;"><i class="fas fa-trash"></i> Loại bỏ</button></form></div>
                            <div th:if="${battery.state == 'charging' or battery.state == 'full'}"><form th:action="@{/staff/batteries/update}" method="POST" style="display: inline-block;"><input type="hidden" name="batteryId" th:value="${battery.batteryId}"><input type="hidden" name="newState" value="maintenance"><button type="submit" class="btn warning" style="padding: 0.5rem 1rem;"><i class="fas fa-pause"></i> Dừng / Bảo trì</button></form></div>
                            <div th:if="${battery.state == 'retired'}"><form th:action="@{/staff/batteries/update}" method="POST" style="display: inline-block;"><input type="hidden" name="batteryId" th:value="${battery.batteryId}" /><input type="hidden" name="newState" value="maintenance" /><button type="submit" class="btn primary" style="padding: 0.5rem 1rem;"><i class="fas fa-recycle"></i> Khôi phục</button></form></div>
                        </td>
                    </tr>
                    <tr th:if="${batteryList == null || batteryList.isEmpty()}"><td colspan="6" class="empty-state">Không tìm thấy pin nào.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer class="staff-footer">
    © 2024 EV SWAP - Staff Portal.
</footer>

</body>
</html>
