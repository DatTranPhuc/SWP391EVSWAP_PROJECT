<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Pin</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/staff.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        .manage-layout {
            display: grid;
            grid-template-columns: 1fr; /* Mặc định 1 cột */
            gap: 2.5rem;
        }

        /* Khi màn hình lớn, chia 2 cột: Form bên trái, List bên phải */
        @media (min-width: 1024px) {
            .manage-layout {
                grid-template-columns: 350px 1fr; /* Cột form nhỏ, cột list lớn */
            }
        }

        /* Style cho thẻ <select> để giống <input> */
        .form-control-select {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-family: var(--font-family);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(15, 20, 30, 0.72) url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22%23a0aec0%22%3E%3Cpath%20fill-rule%3D%22evenodd%22%20d%3D%22M5.293%207.293a1%201%200%20011.414%200L10%2010.586l3.293-3.293a1%201%200%20111.414%201.414l-4%204a1%201%200%2001-1.414%200l-4-4a1%201%200%20010-1.414z%22%20clip-rule%3D%22evenodd%22%20%2F%3E%3C%2Fsvg%3E') no-repeat right 0.75rem center;
            background-size: 1.25em 1.25em;
            color: var(--text-dark);
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        /* Style cho thanh cuộn của bảng */
        .table-scroll-container {
            max-height: 600px;  /* Đặt chiều cao tối đa cho bảng */
            overflow-y: auto;   /* Tự động thêm cuộn dọc KHI cần */
            overflow-x: auto;   /* Giữ lại cuộn ngang */
        }
    </style>
</head>

<body class="staff-body">

<header class="staff-top-nav">
    <div class="container nav-inner">
        <a th:href="@{/staff/dashboard}" class="brand">
            <i class="fas fa-charging-station brand-icon"></i>
            <span th:text="${stationName ?: 'Staff'}">Tên Trạm</span>
        </a>

        <nav class="nav-links">
            <a th:href="@{/staff/dashboard}" class="nav-link-button">Tổng quan</a>
            <a th:href="@{/staff/batteries}" class="nav-link-button active">Quản lý Pin</a>
            <a href="#" class="nav-link-button">Giao dịch</a>
        </nav>

        <div class="auth-area">
                <span class="welcome" th:if="${session.loggedInStaff}">
                    Chào, <strong th:text="${session.loggedInStaff.fullName}"></strong>
                </span>
            <form th:action="@{/logout}" method="POST" style="margin: 0;">
                <button class="btn ghost" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</header>

<main class="container">

    <header class="staff-header" style="margin-bottom: 2rem;">
        <h1 class="staff-title">Quản lý Pin</h1>
        <p class="staff-subtitle">Thêm mới pin hoặc cập nhật trạng thái pin tại trạm.</p>
    </header>

    <div th:if="${successMessage}" class="staff-alert success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="staff-alert error" th:text="${errorMessage}"></div>
    <div th:if="${createError}" class="staff-alert error" th:text="${createError}"></div>

    <div class="manage-layout">

        <div class="staff-form-card" style="padding: 2rem; max-width: none;">
            <h2>Thêm pin mới</h2>

            <form th:action="@{/staff/batteries/add}" method="POST" th:object="${newBattery}">

                <div th:if="${#fields.hasErrors('global')}" class="form-error">
                    <p th:each="err : ${#fields.errors('global')}" th:text="${err}"></p>
                </div>

                <div class="form-group">
                    <label for="vehicleType">Loại xe tương thích</label>
                    <select id="vehicleType" th:field="*{vehicleType}" class="form-control-select" required>
                        <option value="">-- Chọn loại xe --</option>
                        <option value="motorcycle">Xe máy điện</option>
                        <option value="car">Ô tô điện</option>
                    </select>
                    <small class="form-error" th:if="${#fields.hasErrors('vehicleType')}" th:errors="*{vehicleType}"></small>
                </div>

                <div class="form-group">
                    <label for="model">Model Pin</label>
                    <input type="text" id="model" th:field="*{model}" placeholder="Ví dụ: MODEL-A, MODEL-B">
                    <small class="form-error" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></small>
                </div>

                <div class="form-group">
                    <label for="state">Trạng thái ban đầu</label>
                    <select id="state" th:field="*{state}" class="form-control-select">
                        <option value="charging">Charging (Đang sạc)</option>
                        <option value="maintenance">Maintenance (Bảo trì)</option>
                        <option value="full">Full (Đầy)</option>
                    </select>
                    <small class="form-error" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></small>
                </div>

                <div class="form-group">
                    <label for="sohPercent">SOH (%)</label>
                    <input type="number" id="sohPercent" th:field="*{sohPercent}" placeholder="100">
                    <small class="form-error" th:if="${#fields.hasErrors('sohPercent')}" th:errors="*{sohPercent}"></small>
                </div>

                <div class="form-group">
                    <label for="socPercent">SOC (%)</label>
                    <input type="number" id="socPercent" th:field="*{socPercent}" placeholder="0">
                    <small class="form-error" th:if="${#fields.hasErrors('socPercent')}" th:errors="*{socPercent}"></small>
                </div>

                <div class="form-group">
                    <label for="quantity">Số lượng</label>
                    <input type="number" id="quantity" th:field="*{quantity}" placeholder="1">
                    <small class="form-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></small>
                </div>

                <div class="form-actions" style="text-align: left; margin-top: 1rem;">
                    <button type="submit" class="btn primary" style="width: 100%;">Thêm Pin</button>
                </div>
            </form>
        </div>

        <div class="staff-content-card" style="padding: 2rem;">

            <div class="content-header" style="margin-bottom: 1rem;">
                <h2 style="font-size: 1.5rem;">Danh sách pin tại trạm</h2>

                <form th:action="@{/staff/batteries}" method="GET" class="staff-search" style="align-items: center;">
                    <select name="searchType" class="form-control-select"
                            style="padding: 0.6rem 1rem; width: 150px; font-size: 0.9rem;">
                        <option value="state" th:selected="${currentSearchType == 'state' or currentSearchType == null}">Theo Trạng thái</option>
                        <option value="id" th:selected="${currentSearchType == 'id'}">Theo ID Pin</option>
                        <option value="model" th:selected="${currentSearchType == 'model'}">Theo Model</option>
                    </select>

                    <input type="text" name="searchTerm" placeholder="Nhập từ khóa..."
                           th:value="${currentSearchTerm}"
                           style="width: 200px;">

                    <button type="submit" class="btn primary" style="padding: 0.6rem 1.2rem;">Tìm</button>
                </form>
            </div>

            <div class="table-scroll-container">
                <table class="staff-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Loại xe</th>
                        <th>Model</th>
                        <th>SOH</th>
                        <th>SOC</th>
                        <th>Trạng thái</th>
                        <th>Hành động (Cập nhật)</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="battery : ${batteryList}">
                        <td th:text="${battery.batteryId}">#101</td>
                        <td th:text="${battery.vehicleType == 'motorcycle'} ? 'Xe máy điện' : (${battery.vehicleType} == 'car' ? 'Ô tô điện' : 'N/A')">N/A</td>
                        <td th:text="${battery.model}">Model-X</td>
                        <td th:text="${battery.sohPercent + '%'}">98%</td>
                        <td th:text="${battery.socPercent + '%'}">100%</td>
                        <td>
                                    <span class="status-badge"
                                          th:classappend="${battery.state == 'full' || battery.state == 'charging'} ? 'active' : 'inactive'"
                                          th:text="${battery.state}">full</span>
                        </td>
                        <td>
                            <form th:action="@{/staff/batteries/update}" method="POST" style="display: flex; gap: 0.5rem; min-width: 250px;">

                                <input type="hidden" name="batteryId" th:value="${battery.batteryId}">

                                <select name="newState"
                                        style="background: #0f141e; color: #f3f4f6; border-radius: 8px; border: 1px solid var(--border-color); padding: 0.5rem; min-width: 150px;">
                                    <option value="charging" th:selected="${battery.state == 'charging'}">Charging</option>
                                    <option value="maintenance" th:selected="${battery.state == 'maintenance'}">Maintenance</option>
                                    <option value="retired" th:selected="${battery.state == 'retired'}">Retired</option>
                                </select>

                                <button type="submit" class="btn primary" style="padding: 0.5rem 1rem;">Lưu</button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${batteryList == null || batteryList.isEmpty()}">
                        <td colspan="6" class="empty-state">
                            Không tìm thấy pin nào.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div> </div> </main>

<footer class="staff-footer">
    © 2024 EV SWAP - Staff Portal.
</footer>

</body>
</html>
