<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Trạm - EV SWAP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body class="admin-body">

<header class="admin-top-nav">
    <div class="container nav-inner">
        <div class="brand">
            <span class="brand-icon">🚗</span>
            <span class="brand-name">EV SWAP</span>
            <span class="admin-badge">Admin Panel</span>
        </div>
        <nav class="nav-links">
            <a th:href="@{/admin/dashboard}" class="nav-link-button">Tổng quan</a>
            <a th:href="@{/admin/staff}" class="nav-link-button">Quản lý Staff</a>
            <a th:href="@{/admin/stations}" class="nav-link-button active">Quản lý Trạm</a>
        </nav>
        <div class="auth-area" th:if="${session.loggedInAdmin}">
            <span class="welcome">Xin chào, <strong th:text="${session.loggedInAdmin.fullName}">Admin</strong>!</span>
            <form th:action="@{/logout}" method="post"><button class="btn ghost" type="submit">Đăng xuất</button></form>
        </div>
    </div>
</header>

<main class="container">
    <div class="admin-form-card">
        <h2>Thêm Trạm mới</h2>

        <div th:if="${error}" class="admin-alert error" th:text="${error}"></div>
        <div th:if="${success}" class="admin-alert success" th:text="${success}"></div>

        <form th:action="@{/admin/stations/add}" th:object="${station}" method="post">

            <div class="form-group">
                <label for="name">Tên trạm</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Ví dụ: Trạm EV SWAP Quận 1">
                <div class="form-error" th:if="${nameError}" th:text="${nameError}"></div>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="address" th:field="*{address}" placeholder="123 Nguyễn Huệ, P. Bến Nghé, Q.1, TP.HCM" style="flex: 1;">
                    <button type="button" id="search-address-btn" class="btn" style="white-space: nowrap; background: linear-gradient(135deg, #6366f1, #22d3ee); color: #020817; border: none;">Tìm kiếm</button>
                </div>
                <div class="form-error" th:if="${addressError}" th:text="${addressError}"></div>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label style="display: block; margin: 0;">Bản đồ xác nhận vị trí</label>
                    <button type="button" id="my-location-btn" class="btn" style="white-space: nowrap; font-size: 0.875rem; background: linear-gradient(135deg, #6366f1, #22d3ee); color: #020817; border: none; padding: 0.5rem 1rem;">
                        📍 Vị trí của tôi
                    </button>
                </div>
                <div id="map" style="height: 400px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);"></div>
                <p style="margin-top: 0.5rem; font-size: 0.875rem; color: rgba(243,244,246,0.7);">Click vào bản đồ để đặt marker hoặc kéo marker để điều chỉnh vị trí</p>
            </div>

            <div class="form-group">
                <label for="latitude">Vĩ độ (Latitude)</label>
                <input type="number" step="0.000001" id="latitude" th:field="*{latitude}" placeholder="10.776889">
                <div class="form-error" th:if="${latitudeError}" th:text="${latitudeError}"></div>
            </div>

            <div class="form-group">
                <label for="longitude">Kinh độ (Longitude)</label>
                <input type="number" step="0.000001" id="longitude" th:field="*{longitude}" placeholder="106.700806">
                <div class="form-error" th:if="${longitudeError}" th:text="${longitudeError}"></div>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/stations}" class="btn ghost">Hủy</a>
                <button type="submit" class="btn primary">Tạo trạm</button>
            </div>
        </form>
    </div>
</main>

<footer class="admin-footer">
    <div class="container"><p>© 2025 EV SWAP - Admin Control Panel.</p></div>
</footer>


<script th:inline="javascript">
    let map = null;
    let marker = null;
    const latitudeInput = document.getElementById('latitude');
    const longitudeInput = document.getElementById('longitude');
    const addressInput = document.getElementById('address');
    const searchAddressBtn = document.getElementById('search-address-btn');
    const myLocationBtn = document.getElementById('my-location-btn');

    // Initialize map
    if (typeof L !== 'undefined') {
        map = L.map('map').setView([10.7769, 106.7009], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Marker icon
        const markerIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Create marker
        marker = L.marker([10.7769, 106.7009], { icon: markerIcon, draggable: true })
            .addTo(map)
            .bindPopup('Vị trí trạm')
            .openPopup();

        // Update inputs when marker is dragged
        marker.on('dragend', function() {
            const latLng = marker.getLatLng();
            latitudeInput.value = latLng.lat.toFixed(6);
            longitudeInput.value = latLng.lng.toFixed(6);
        });

        // Update marker when map is clicked
        map.on('click', function(e) {
            marker.setLatLng(e.latlng).update();
            latitudeInput.value = e.latlng.lat.toFixed(6);
            longitudeInput.value = e.latlng.lng.toFixed(6);
        });

        // Update marker when manual input changes
        latitudeInput.addEventListener('change', updateMarkerFromInputs);
        longitudeInput.addEventListener('change', updateMarkerFromInputs);

        function updateMarkerFromInputs() {
            const lat = parseFloat(latitudeInput.value);
            const lng = parseFloat(longitudeInput.value);
            if (!isNaN(lat) && !isNaN(lng)) {
                marker.setLatLng([lat, lng]).update();
                map.setView([lat, lng], 15);
            }
        }

        // Address search using Nominatim (OpenStreetMap)
        searchAddressBtn.addEventListener('click', function() {
            const address = addressInput.value.trim();
            if (!address) {
                alert('Vui lòng nhập địa chỉ để tìm kiếm');
                return;
            }

            searchAddressBtn.disabled = true;
            searchAddressBtn.textContent = 'Đang tìm...';

            const nominatimUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1&addressdetails=1&accept-language=vi`;
            
            fetch(nominatimUrl)
                .then(response => response.json())
                .then(data => {
                    searchAddressBtn.disabled = false;
                    searchAddressBtn.textContent = 'Tìm kiếm';
                    
                    if (data && data.length > 0) {
                        const result = data[0];
                        const lat = parseFloat(result.lat);
                        const lon = parseFloat(result.lon);
                        
                        marker.setLatLng([lat, lon]).update();
                        map.setView([lat, lon], 16);
                        latitudeInput.value = lat.toFixed(6);
                        longitudeInput.value = lon.toFixed(6);
                        
                        // Update address with result
                        addressInput.value = result.display_name;
                    } else {
                        alert('Không tìm thấy địa chỉ này. Vui lòng thử địa chỉ khác.');
                    }
                })
                .catch(error => {
                    console.error('Geocoding error:', error);
                    searchAddressBtn.disabled = false;
                    searchAddressBtn.textContent = 'Tìm kiếm';
                    alert('Lỗi khi tìm kiếm địa chỉ. Vui lòng thử lại.');
                });
        });

        // Enter key to search
        addressInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchAddressBtn.click();
            }
        });

        // My Location button handler
        myLocationBtn.addEventListener('click', function() {
            if (!navigator.geolocation) {
                alert('Trình duyệt của bạn không hỗ trợ định vị.');
                return;
            }

            myLocationBtn.disabled = true;
            myLocationBtn.textContent = '⏳ Đang lấy vị trí...';

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    marker.setLatLng([lat, lng]).update();
                    map.setView([lat, lng], 16);
                    latitudeInput.value = lat.toFixed(6);
                    longitudeInput.value = lng.toFixed(6);
                    
                    myLocationBtn.disabled = false;
                    myLocationBtn.textContent = '📍 Vị trí của tôi';
                    
                    // Reverse geocoding to get address
                    const reverseGeocodeUrl = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1&accept-language=vi`;
                    fetch(reverseGeocodeUrl)
                        .then(response => response.json())
                        .then(data => {
                            if (data && data.display_name) {
                                addressInput.value = data.display_name;
                            }
                        })
                        .catch(error => console.error('Reverse geocoding error:', error));
                },
                function(error) {
                    myLocationBtn.disabled = false;
                    myLocationBtn.textContent = '📍 Vị trí của tôi';
                    alert('Không thể lấy vị trí. Vui lòng cho phép quyền truy cập vị trí hoặc thử lại.');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
            );
        });
    }
</script>

</body>
</html>
