<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa Trạm - EV SWAP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body class="admin-body">

<header class="admin-top-nav">
    <div class="container nav-inner">
        <div class="brand">
            <span class="brand-icon">🚗</span> <span class="brand-name">EV SWAP</span> <span class="admin-badge">Admin Panel</span>
        </div>
        <nav class="nav-links">
            <a th:href="@{/admin/dashboard}" class="nav-link-button">Tổng quan</a>
            <a th:href="@{/admin/staff}" class="nav-link-button">Quản lý Staff</a>
            <a th:href="@{/admin/stations}" class="nav-link-button active">Quản lý Trạm</a>
        </nav>
        <div class="auth-area" th:if="${session.loggedInAdmin}">
            <span class="welcome">Xin chào, <strong th:text="${session.loggedInAdmin.fullName}">Admin</strong>!</span>
            <form th:action="@{/logout}" method="post"><button class="btn ghost" type="submit">Đăng xuất</button></form>
        </div>
    </div>
</header>

<main class="container">
    <div class="admin-form-card">
        <h2>Sửa thông tin Trạm</h2>

        <div th:if="${error}" class="admin-alert error" th:text="${error}"></div>

        <form th:action="@{/admin/stations/edit/{stationId}(stationId=${id})}" th:object="${station}" method="post">

            <div class="form-group">
                <label for="name">Tên trạm</label>
                <input type="text" id="name" th:field="*{name}">
                <div class="form-error" th:if="${nameError}" th:text="${nameError}"></div>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ</label>
                <input type="text" id="address" th:field="*{address}">
                <div class="form-error" th:if="${addressError}" th:text="${addressError}"></div>
            </div>

            <div class="form-group">
                <label for="latitude">Vĩ độ (Latitude)</label>
                <input type="number" step="any" id="latitude" th:field="*{latitude}">
                <div class="form-error" th:if="${latitudeError}" th:text="${latitudeError}"></div>
            </div>

            <div class="form-group">
                <label for="longitude">Kinh độ (Longitude)</label>
                <input type="number" step="any" id="longitude" th:field="*{longitude}">
                <div class="form-error" th:if="${longitudeError}" th:text="${longitudeError}"></div>
            </div>

            <div class="form-group">
                <label for="status">Trạng thái</label>
                <select id="status" th:field="*{status}"
                        style="width: 100%; padding: 0.75rem 1rem; font-size: 1rem; font-family: var(--font-family); border: 1px solid var(--border-color); border-radius: 12px; background: rgba(15, 20, 30, 0.72); color: var(--text-dark); box-sizing: border-box;">
                    <option value="active">Active (Hoạt động)</option>
                    <option value="closed">Closed (Đóng cửa)</option>
                    <option value="maintenance">Maintenance (Bảo trì)</option>
                </select>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/stations}" class="btn ghost">Hủy</a>
                <button type="submit" class="btn primary">Cập nhật</button>
            </div>
        </form>
    </div> </main>

<footer class="admin-footer">
    <div class="container"><p>© 2025 EV SWAP - Admin Control Panel.</p></div>
</footer>

</body>
</html>
