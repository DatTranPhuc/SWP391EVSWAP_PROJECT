<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Trạm - EV SWAP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body class="admin-body">

<header class="admin-top-nav">
    <div class="container nav-inner">
        <div class="brand">
            <span class="brand-icon">🚗</span> <span class="brand-name">EV SWAP</span> <span class="admin-badge">Admin Panel</span>
        </div>
        <nav class="nav-links">
            <a th:href="@{/admin/dashboard}" class="nav-link-button">Tổng quan</a>
            <a th:href="@{/admin/staff}" class="nav-link-button">Quản lý Staff</a>
            <a th:href="@{/admin/stations}" class="nav-link-button active">Quản lý Trạm</a>
        </nav>
        <div class="auth-area" th:if="${session.loggedInAdmin}">
            <span class="welcome">Xin chào, <strong th:text="${session.loggedInAdmin.fullName}">Admin</strong>!</span>
            <form th:action="@{/logout}" method="post"><button class="btn ghost" type="submit">Đăng xuất</button></form>
        </div>
    </div>
</header>

<main class="container">
    <div class="admin-content-card">

        <div class="content-header">
            <h2>Quản lý Trạm</h2>

            <div class="admin-search">
                <form th:action="@{/admin/stations}" method="get" class="admin-search">
                    <input type="text" name="search" placeholder="Tìm kiếm theo tên..." th:value="${search}" />
                    <button class="btn primary" type="submit">Tìm</button>
                </form>
            </div>

            <a th:href="@{/admin/stations/add}" class="btn primary">Thêm Trạm ⁺</a>
        </div>

        <div th:if="${success}" class="admin-alert success" th:text="${success}"></div>
        <div th:if="${error}" class="admin-alert error" th:text="${error}"></div>

        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên trạm</th>
                <th>Địa chỉ</th>
                <th>Vĩ độ (Lat)</th>
                <th>Kinh độ (Lng)</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="station : ${stationList}">
                <td th:text="${station.stationId}">1</td>
                <td th:text="${station.name}">EVSWAP1</td>
                <td th:text="${station.address}">123 Đồng Nai</td>
                <td th:text="${station.latitude}">10.123</td>
                <td th:text="${station.longitude}">106.456</td>
                <td>
                    <span th:text="${station.status}"
                          th:classappend="${station.status == 'active' ? 'status-badge active' : 'status-badge inactive'}">
                        active
                    </span>
                </td>
                <td class="action-links">
                    <a th:href="@{/admin/stations/edit/{id}(id=${station.stationId})}" class="edit-link">Sửa</a>

                    <form th:action="@{/admin/stations/delete/{id}(id=${station.stationId})}" method="post" style="display: inline; margin: 0; padding: 0;">
                        <button type="submit" class="delete-link"
                                style="border: none; background: none; padding: 0; font-family: inherit; font-size: inherit; cursor: pointer;"
                                onclick="return confirm('Bạn có chắc chắn muốn xóa trạm này?');">
                            Xóa
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(stationList)}">
                <td colspan="7" class="empty-state">Không tìm thấy trạm nào.</td>
            </tr>
            </tbody>
        </table>
    </div> </main>

<footer class="admin-footer">
    <div class="container"><p>© 2025 EV SWAP - Admin Control Panel.</p></div>
</footer>

</body>
</html>
